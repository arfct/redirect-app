[[edge_functions]]
  path = "/*/*"
  function = "metadata"

[[redirects]]
  from = "/bot/link"
  to = "/.netlify/functions/linkbot"
  status = 200

[[redirects]]
  from = "/edit/*"
  to = "/edit.html"
  status = 200

[[redirects]]
  from = "/view"
  to = "/view.html"
  status = 200

[[redirects]]
  from = "/view/*"
  to = "/view.html"
  status = 200

[[redirects]]
  from = "/cast/receiver"
  to = "/cast-receiver.html"
  status = 200

[[redirects]]
  from = "/cast/receiver/*"
  to = "/cast-receiver.html"
  status = 200

[[redirects]]
  from = "/cast"
  to = "/cast.html"
  status = 200

[[redirects]]
  from = "/cast/*"
  to = "/cast.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
