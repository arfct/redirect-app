<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Redirect.app</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, avenir next, avenir, segoe ui, helvetica neue, helvetica, Cantarell, Ubuntu, roboto, noto, arial, sans-serif;
  }

  #chrome {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 24px;
    transition: opacity 0.6s ease;
  }
  #chrome.done { opacity: 0; pointer-events: none; }

  #icon { width: 64px; height: 64px; object-fit: contain; }
  #icon:not([src]) { display: none; }

  #title { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  #host { font-size: 15px; color: rgba(255,255,255,0.45); word-break: break-all; max-width: 80vw; }
  #note { font-size: 13px; color: rgba(255,255,255,0.35); max-width: 34em; line-height: 1.5; }
  #note a { color: rgba(255,255,255,0.7); }

  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  iframe.show { opacity: 1; }
</style>
<body>
  <iframe id="frame" hidden></iframe>
  <div id="chrome">
    <img id="icon" alt="">
    <div id="title"></div>
    <div id="host"></div>
    <div id="note"></div>
  </div>

  <script src="/forward.js"></script>
  <script>
  (function () {
    var info = parseForwardPath(location.pathname, location.search, location.hash);
    var chrome = document.getElementById("chrome");
    var note = document.getElementById("note");

    function say(text, html) {
      if (html) note.innerHTML = text; else note.textContent = text;
    }

    if (info.c) document.body.style.background = "#" + info.c.replace(/^#/, "");
    if (info.f) document.getElementById("icon").src = iconToURL(info.f);
    document.getElementById("title").textContent = info.t || (info.u ? "Opening" : "Nothing to open");

    if (!info.u) {
      say('Add a target, for example <a href="/view/u/:example.com/">/view/u/:example.com/</a>', true);
      return;
    }

    document.getElementById("host").textContent = info.u;
    if (info.t) document.title = info.t;

    if (!isSafeTarget(info.u)) {
      document.getElementById("title").textContent = "Blocked";
      say("That scheme is not allowed.");
      return;
    }

    // Wrap: keep redirect.app on top and show the target in a frame. Only
    // works where the target permits framing, so it is opt-in.
    if (info.m === "f") {
      if (!isFramable(info.u)) {
        say("Only http and https targets can be wrapped. Drop /m/f to forward instead.");
        return;
      }
      var frame = document.getElementById("frame");
      frame.hidden = false;
      frame.onload = function () {
        frame.classList.add("show");
        chrome.classList.add("done");
      };
      frame.src = info.u;
      // A blocked frame still fires onload, so leave a way out if nothing paints.
      setTimeout(function () {
        if (!frame.classList.contains("show")) {
          say("If this stays blank the site refuses to be framed. Drop /m/f to forward instead.");
        }
      }, 8000);
      return;
    }

    // Forward: hand the whole tab over. Works for any scheme, any site, and
    // for plain-http targets, because a top-level navigation is not mixed
    // content. Nothing of ours survives it, which is the point.
    location.replace(info.u);
  })();
  </script>
</body>
